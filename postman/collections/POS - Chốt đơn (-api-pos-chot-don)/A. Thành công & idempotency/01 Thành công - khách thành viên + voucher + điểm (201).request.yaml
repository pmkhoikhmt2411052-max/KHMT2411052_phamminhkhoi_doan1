$kind: http-request
description: "Chạy request này TRƯỚC (nó sinh runId). Sau đó đối chiếu DB: tồn giảm, LichSuTonKho BAN_HANG, Voucher.da_su_dung, VoucherLuotDung, diemTichLuy, LichSuDiem, ThanhToan THANH_CONG."
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamId}}",
          "soLuong": 2
        }
      ],
      "maVoucher": "{{voucherOk}}",
      "diemSuDung": 5,
      "khachHangId": "{{khachHangId}}",
      "tienKhachDua": "{{tienDuLon}}",
      "idempotencyKey": "{{runId}}-main"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('runId', 'pos-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      const j = pm.response.json();
      const d = j.data || j;
      pm.test('Có maDh, chiTiet, tienThua', function () {
        pm.expect(d).to.have.property('maDh');
        pm.expect(d.chiTiet).to.be.an('array').that.is.not.empty;
        pm.expect(d).to.have.property('tienThua');
      });
      pm.test('maGiaoDich = POS-<khóa>', function () { pm.expect(d.thanhToan.maGiaoDich).to.eql('POS-' + pm.collectionVariables.get('runId') + '-main'); });
      pm.test('Có diemSuDung, diemCong', function () { pm.expect(d).to.have.property('diemSuDung'); pm.expect(d).to.have.property('diemCong'); });
      pm.collectionVariables.set('maDhMain', d.maDh);
    language: text/javascript
order: 1000
