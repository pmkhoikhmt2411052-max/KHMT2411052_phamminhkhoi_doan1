$kind: http-request
description: Điền biến voucherHetLuotKhach. Mã lỗi cụ thể chưa rõ nên chỉ kiểm tra status 400 - xem response để đối chiếu mã.
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamId}}",
          "soLuong": 2
        }
      ],
      "maVoucher": "{{voucherHetLuotKhach}}",
      "diemSuDung": 0,
      "khachHangId": "{{khachHangId}}",
      "tienKhachDua": "{{tienDuLon}}",
      "idempotencyKey": "{{runId}}-v16"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
