$kind: http-request
name: 12 Khách lẻ nhưng diemSuDung > 0 (400)
description: Khách lẻ phải có diemSuDung = 0. Mã lỗi cụ thể chưa rõ nên chỉ kiểm tra status.
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamId}}",
          "soLuong": 2
        }
      ],
      "diemSuDung": 5,
      "tienKhachDua": "{{tienDuLon}}",
      "idempotencyKey": "{{runId}}-le-diem"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 6000
