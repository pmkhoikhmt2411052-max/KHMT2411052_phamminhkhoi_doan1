$kind: http-request
description: Cần 1 sản phẩm giá 0đ (hoặc voucher giảm hết) -> điền biến sanPhamGia0.
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamGia0}}",
          "soLuong": 1
        }
      ],
      "diemSuDung": 0,
      "tienKhachDua": "0",
      "idempotencyKey": "{{runId}}-zero"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test('Có mã lỗi INVALID_TOTAL', function () { pm.expect(pm.response.text()).to.include('INVALID_TOTAL'); });
    language: text/javascript
order: 5000
