$kind: http-request
name: 07 Tiền đưa < tổng (400 INSUFFICIENT_CASH)
description: Không được ghi gì vào DB.
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamId}}",
          "soLuong": 2
        }
      ],
      "diemSuDung": 0,
      "tienKhachDua": "1000",
      "idempotencyKey": "{{runId}}-cash"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test('Có mã lỗi INSUFFICIENT_CASH', function () { pm.expect(pm.response.text()).to.include('INSUFFICIENT_CASH'); });
    language: text/javascript
order: 1000
