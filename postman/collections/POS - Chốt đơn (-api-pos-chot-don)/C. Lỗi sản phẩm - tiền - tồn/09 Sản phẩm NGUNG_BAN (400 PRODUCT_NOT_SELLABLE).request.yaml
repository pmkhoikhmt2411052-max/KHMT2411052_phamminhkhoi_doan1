$kind: http-request
url: "{{baseUrl}}/api/pos/chot-don"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "chiTiet": [
        {
          "sanPhamId": "{{sanPhamNgungBan}}",
          "soLuong": 2
        }
      ],
      "diemSuDung": 0,
      "tienKhachDua": "{{tienDuLon}}",
      "idempotencyKey": "{{runId}}-ngung"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test('Có mã lỗi PRODUCT_NOT_SELLABLE', function () { pm.expect(pm.response.text()).to.include('PRODUCT_NOT_SELLABLE'); });
    language: text/javascript
order: 3000
